name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with this IPA'
        required: false
        type: boolean
        default: true

jobs:
  build-ipa:
    name: Build & Package .ipa
    runs-on: macos-13
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.0.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project ChatGPT.xcodeproj \
            -scheme ChatGPT \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ChatGPT.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/ChatGPT.xcarchive/Products/Applications/ChatGPT.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/ChatGPT.ipa" Payload
          test -s "$GITHUB_WORKSPACE/ChatGPT.ipa"
          ls -lh "$GITHUB_WORKSPACE/ChatGPT.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-iOS-IPA
          path: ChatGPT.ipa
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2026.300-build${{ github.run_number }}
          name: ChatGPT iOS Build v1.2026.300 (${{ github.run_number }})
          body: |
            Automated native iOS build ported from Android APK.
            
            ### Artifacts
            - **ChatGPT.ipa**: Ready for sideloading via AltStore, TrollStore, Sideloadly, or Apple Configurator.
          files: ChatGPT.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
